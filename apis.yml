aid: karat
name: Karat
description: 'Karat Inc. is a Seattle-based technical interviewing platform that conducts
  standardized software engineering interviews for enterprise hiring teams through its
  community of trained Interview Engineers. Karat exposes a GraphQL API, hosted per-customer
  at https://{subdomain}.karat.io/api/v1/graphql, that lets talent and ATS systems
  programmatically manage roles and groups, look up users, invite candidates into
  assessments, retrieve candidacy statuses, code-challenge and interview results, and
  bulk-update candidacy dispositions. The API uses Bearer token authentication, Relay-style
  cursor pagination, and ships an example Python SDK and a Postman collection. Karat is
  SOC 2 Type II certified and certified under the EU-US, UK-US and Swiss-US Data Privacy
  Frameworks.'
